controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: go2_bringup::HeightAwareGoalChecker
      xy_goal_tolerance: 0.08
      z_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      stateful: true
      desired_linear_vel: 0.25
      min_approach_linear_velocity: 0.18
      approach_velocity_scaling_dist: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.2
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: world
      robot_base_frame: base
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 1000.0
        observation_sources: lidar clearing
        lidar:
          topic: /go2/obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          # Height filtering is performed relative to base, before this layer.
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          expected_update_rate: 0.5
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
        clearing:
          topic: /go2/clearing_points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          expected_update_rate: 0.5
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

obstacle_height_filter:
  ros__parameters:
    use_sim_time: true
    world_frame: world
    base_frame: base
    min_relative_height: -0.25
    max_relative_height: 0.45
