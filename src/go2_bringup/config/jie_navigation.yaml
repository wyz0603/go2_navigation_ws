jie_pcd_octomap:
  ros__parameters:
    use_sim_time: true
    pcd_file: ''
    frame_id: world
    octomap_topic: /jie/octomap
    pointcloud_topic: /jie/map_points
    resolution: 0.2
    min_points_per_voxel: 1

jie_path_node:
  ros__parameters:
    use_sim_time: true
    octomap_topic: /jie/octomap
    start_topic: /jie/start_point
    goal_topic: /jie/goal_point
    goal_pose_topic: /jie/goal_pose
    reset_topic: /jie/reset
    path_topic: /jie/planned_path
    path_marker_topic: /jie/planned_path_marker
    preblocked_marker_topic: /jie/preblocked_cells_markers
    external_preblocked_marker_topic: /jie/edited_preblocked_cells_markers
    edited_occupied_marker_topic: /jie/edited_occupied_markers
    traversable_marker_topic: /jie/traversable_cells_markers
    risk_cost_topic: /jie/risk_cost_cells
    frame_id: world
    robot_radius: 0.35
    max_iterations: 300000
    snap_search_radius_cells: 12
    require_ground_support: true
    strict_direct_ground_support: false
    ground_support_xy_radius_cells: 1
    ground_support_depth_cells: 1
    enable_preblocked_costmap: true
    preblocked_costmap_radius_cells: 3
    preblocked_costmap_weight: 2.5
    lowest_traversable_only: false
    map_id: go2_building
    source_world_file: ''

go2_path_follower:
  ros__parameters:
    use_sim_time: true
    path_topic: /jie/planned_path
    start_navigation_topic: /jie/start_navigation
    stop_navigation_topic: /jie/stop_navigation
    cmd_vel_topic: /cmd_vel_nav
    manual_cmd_vel_topic: /cmd_vel_teleop
    tracking_point_marker_topic: /jie/tracking_point_marker
    controller_active_topic: /jie/controller_active
    map_frame: world
    base_frame: base
    base_frame_candidates: base,base_link,base_footprint
    robot_center_offset_frame: base
    robot_center_offset_x: 0.0
    robot_center_offset_y: 0.0
    robot_center_offset_z: 0.0
    require_start_command: true
    control_frequency: 20.0
    lookahead_distance: 0.55
    tracking_point_reached_xy_tolerance: 0.30
    tracking_point_marker_scale: 0.28
    enable_tracking_debug_view: false
    goal_position_tolerance: 0.12
    goal_yaw_tolerance: 0.20
    linear_gain: 1.0
    lateral_gain: 0.8
    heading_gain: 0.8
    cross_track_angular_gain: 0.5
    final_yaw_gain: 0.3
    enable_lateral_motion: false
    max_linear_speed: 0.25
    max_lateral_speed: 0.15
    max_angular_speed: 0.35
    align_final_yaw: true
    linear_deadband: 0.04
    lateral_deadband: 0.04
    angular_deadband: 0.04

jie_go2_navigation:
  ros__parameters:
    use_sim_time: true
    world_frame: world
    base_frame: base
    goal_input_topic: /goal_pose
    plan_start_topic: /jie/start_point
    plan_goal_topic: /jie/goal_point
    plan_goal_pose_topic: /jie/goal_pose
    planner_reset_topic: /jie/reset
    path_topic: /jie/planned_path
    controller_active_topic: /jie/controller_active
    start_navigation_topic: /jie/start_navigation
    stop_navigation_topic: /jie/stop_navigation
    navigation_mode_service: /go2/set_navigation
