ugv_nav4d_ros2:
  ros__parameters:
    read_pose_from_topic: false
    auto_execute_goal: true
    load_mls_from_file: false
    mls_file_type: ply
    mls_file_path: ''
    mls_gap_size: 0.4
    ply_downsample_leaf_size: 0.0
    robot_frame: base
    world_frame: world
    grid_resolution: 0.2
    dist_max_x: 20
    dist_min_x: -20
    dist_max_y: 20
    dist_min_y: -20
    dist_max_z: 8.0
    dist_min_z: -2.0
    dumpOnError: false
    dumpOnSuccess: false
    return_face_forward: true
    mission_file: ugv_nav4d_mission.txt
    speed_zone_surface_tolerance: 0.75
    speed_zone_release_delay: 0.5
    initialPatchRadius: 1.0
    maxMotionCurveLength: 20.0
    minTurningRadius: 0.3
    multiplierBackward: 4.0
    multiplierBackwardTurn: 4.0
    multiplierForward: 1.0
    multiplierForwardTurn: 1.0
    multiplierLateral: 4.0
    multiplierLateralCurve: 4.0
    multiplierPointTurn: 3.0
    rotationSpeed: 0.5
    searchProgressSteps: 0.1
    searchRadius: 0.15
    translationSpeed: 0.5
    spline_sampling_resolution: 0.1
    remove_goal_offset: false
    max_goal_xy_error: 0.12
    align_goal_orientation: true
    curvaturePenaltyWeight: 0.5
    angularCostWeight: 3.0
    epsilonSteps: 2
    initialEpsilon: 64
    numThreads: 4
    usePathStatistics: false
    searchUntilFirstSolution: true
    corridorWidth: 10.0
    maxTime: 20.0
    goalOrientationMargin: 1.0
    goalDistanceMargin: 0.08
    useReedsSheppFinalPath: true
    reedsSheppStepSize: 0.0
    reedsSheppMaxShortcut: 0
    useReedsSheppGoalShot: true
    reedsSheppGoalShotMaxDistance: 15.0
    reedsSheppMaxCusps: 1
    cellSkipFactor: 1.0
    destinationCircleRadius: 10
    generateBackwardMotions: true
    generateForwardMotions: true
    generateLateralMotions: false
    generatePointTurnMotions: true
    numAngles: 42
    numEndAngles: 21
    splineOrder: 4
    allowForwardDownhill: true
    articulatedSuspension: false
    costFunctionDist: 0.0
    distToGround: 0.35
    enableInclineLimitting: false
    inclineLimittingLimit: 0.43
    inclineLimittingMinSlope: 0.22
    initialPatchVariance: 0.0001
    maxSlope: 0.45
    maxStepHeight: 0.45
    minTraversablePercentage: 0.4
    robotHeight: 0.6
    # Include 0.20 m tracking margin around Nav2's 0.35 m radius.
    robotSizeX: 1.1
    robotSizeY: 1.1
    footprintOffsetX: 0.0
    footprint_extra_frames:
    - base
    footprint_margin_front: 1.1
    footprint_margin_rear: 0.6
    footprint_margin_y: 0.65
    footprint_publish_period: 0.0
    slopeMetric: NONE
    slopeMetricScale: 1.0
    obstacleInflationMultiplier: 1.0
    partiallyTraversableMultiplier: 1.0
    numYawSamples: 12
    extend_trajectory: false
    extension_distance: 2.0
ugv_nav4d_follow_path_client:
  ros__parameters:
    robot_frame: base
    max_path_deviation_m: 2.0
    deviation_breaches_to_pause: 2
ugv_nav4d_field_operations:
  ros__parameters:
    localization_timeout: 2.0
    monitor_map_freshness: false
    map_timeout: 10.0
    communications_timeout: 5.0
    heartbeat_required: false
    low_battery_percentage: 0.2
    critical_battery_percentage: 0.1
    low_battery_policy: warn
    lost_communications_policy: warn
    cpu_load_warning: 90.0
    cpu_temperature_warning: 85.0
    disk_free_warning_gb: 2.0
    mission_audit_file: ugv_nav4d_mission_audit.jsonl
